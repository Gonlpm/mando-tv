<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Samsung Remote</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#10131a;color:white;
  font-family:Arial,sans-serif;text-align:center;
}
main{max-width:390px;margin:auto;padding:22px}
h1{font-size:25px}
#status{color:#ffca67;margin:16px}
.remote{
  background:#202631;border-radius:32px;
  padding:22px 18px;box-shadow:0 12px 35px #0008;
}
button{
  border:0;color:white;background:#343d4c;
  border-radius:50%;width:58px;height:58px;
  font-size:20px;margin:5px;cursor:pointer;
  touch-action:manipulation;
}
button:active{background:#087cf0}
.wide{width:100px;border-radius:25px}
.home{background:#087cf0}
.pad{
  margin:20px auto;width:190px;height:190px;
  display:grid;grid-template-columns:1fr 1fr 1fr;
  grid-template-rows:1fr 1fr 1fr;align-items:center;
}
.pad button{margin:auto}
#log{font-size:12px;color:#b7c0ce;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>Samsung Remote</h1>
<div id="status">● Sin conectar</div>
<div class="remote">
  <button class="wide" onclick="send('POWER')">⏻</button>
  <div>
    <button onclick="send('VOLUP')">VOL +</button>
    <button onclick="send('MUTE')">🔇</button>
    <button onclick="send('VOLDOWN')">VOL −</button>
  </div>
  <div>
    <button onclick="send('CHUP')">CH +</button>
    <button onclick="send('CHDOWN')">CH −</button>
  </div>
  <div class="pad">
    <span></span>
    <button onclick="send('UP')">▲</button>
    <span></span>
    <button onclick="send('LEFT')">◀</button>
    <button onclick="send('ENTER')">OK</button>
    <button onclick="send('RIGHT')">▶</button>
    <span></span>
    <button onclick="send('DOWN')">▼</button>
    <span></span>
  </div>
  <div>
    <button onclick="send('BACK')">↩</button>
    <button class="home" onclick="send('HOME')">⌂</button>
    <button onclick="send('MENU')">☰</button>
  </div>
  <div>
    <button onclick="send('PLAY')">▶</button>
    <button onclick="send('PAUSE')">Ⅱ</button>
    <button onclick="send('STOP')">■</button>
  </div>
  <div id="log">Introduce la dirección del servidor de tu mando.</div>
</div>
</main>
<script>
const SERVER = "http://192.168.1.100:8000";

async function send(key){
  const log = document.getElementById("log");
  try{
    const response = await fetch(
      SERVER + "/api/button/" + encodeURIComponent(key),
      {method:"POST"}
    );
    if(!response.ok) throw new Error("Error " + response.status);
    log.textContent = "Enviado: " + key;
  }catch(e){
    log.textContent =
      "Sin conexión al servidor. Configura SERVER y el servicio local.";
  }
}
</script>
</body>
</html>
