
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f1a">
  <title>Mando LG</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f1a; color: #dde;
      font-family: system-ui, sans-serif;
      padding: 12px 10px 24px;
      user-select: none; -webkit-user-select: none;
      touch-action: manipulation;
    }
    h1 {
      text-align: center; font-size: 1rem;
      color: #9292ff; margin-bottom: 12px;
    }
    #status-bar {
      display: flex; align-items: center; gap: 7px;
      margin-bottom: 12px; font-size: .78rem;
    }
    #status { flex: 1; color: #ffb74d; }
    #status.ready, #status.paired { color: #4caf50; }
    #status.error { color: #ff5252; }
    .btn-sm {
      background: #333355; color: #eef; border: 0;
      border-radius: 7px; padding: 7px 10px;
    }
    hr { border: 0; border-top: 1px solid #292944; margin: 12px 0; }
    .btn {
      display: flex; align-items: center; justify-content: center;
      width: 56px; height: 56px; border: 0; border-radius: 50%;
      background: #22223e; color: white; font-weight: 700;
      font-size: .8rem; touch-action: manipulation;
    }
    .btn:active { filter: brightness(1.5); transform: scale(.94); }
    .red { background: #b71c1c; }
    .blue { background: #1565c0; }
    .green { background: #2e7d32; }
    .purple { background: #4a148c; }
    .grey { background: #37474f; }
    .pill { width: 90px; height: 42px; border-radius: 12px; }
    .row {
      display: flex; justify-content: center; align-items: center;
      gap: 10px; margin-bottom: 10px;
    }
    .vc-grid, .dpad, .numpad {
      display: grid; justify-content: center;
      gap: 7px; margin-bottom: 12px;
    }
    .vc-grid { grid-template-columns: repeat(3, 56px); }
    .dpad { grid-template-columns: repeat(3, 56px); }
    .numpad { grid-template-columns: repeat(3, 56px); }
    .blank { visibility: hidden; }
    #log {
      margin-top: 16px; padding: 8px; border-radius: 6px;
      background: #090912; color: #b7b7ce;
      font-size: .68rem; white-space: pre-wrap;
      overflow-wrap: anywhere; max-height: 150px; overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>LG REMOTE · 192.168.1.35</h1>

  <div id="status-bar">
    <span id="status">Desconectado</span>
    <button class="btn-sm" id="connect" onclick="toggleConnect()">Conectar</button>
    <button class="btn-sm" onclick="forgetKey()">Olvidar</button>
  </div>

  <hr>

  <div class="row">
    <button class="btn red" style="width:66px;height:66px;font-size:1.4rem"
      onclick="powerOff()">⏻</button>
  </div>

  <hr>

  <div class="vc-grid">
    <button class="btn blue" onclick="ssapOrBtn('ssap://audio/volumeUp','VOLUMEUP')">VOL+</button>
    <button class="btn purple" onclick="pressBtn('MUTE')">MUTE</button>
    <button class="btn green" onclick="ssapOrBtn('ssap://tv/channelUp','CHANNELUP')">CH+</button>
    <button class="btn blue" onclick="ssapOrBtn('ssap://audio/volumeDown','VOLUMEDOWN')">VOL−</button>
    <div></div>
    <button class="btn green" onclick="ssapOrBtn('ssap://tv/channelDown','CHANNELDOWN')">CH−</button>
  </div>

  <hr>

  <div class="dpad">
    <div class="blank"></div>
    <button class="btn" onclick="pressBtn('UP')">▲</button>
    <div class="blank"></div>
    <button class="btn" onclick="pressBtn('LEFT')">◀</button>
    <button class="btn purple" onclick="pressBtn('ENTER')">OK</button>
    <button class="btn" onclick="pressBtn('RIGHT')">▶</button>
    <div class="blank"></div>
    <button class="btn" onclick="pressBtn('DOWN')">▼</button>
    <div class="blank"></div>
  </div>

  <div class="row">
    <button class="btn grey pill" onclick="pressBtn('BACK')">← ATRÁS</button>
    <button class="btn grey pill" onclick="pressBtn('HOME')">⌂ INICIO</button>
  </div>

  <hr>

  <div class="numpad">
    <button class="btn" onclick="pressBtn('1')">1</button>
    <button class="btn" onclick="pressBtn('2')">2</button>
    <button class="btn" onclick="pressBtn('3')">3</button>
    <button class="btn" onclick="pressBtn('4')">4</button>
    <button class="btn" onclick="pressBtn('5')">5</button>
    <button class="btn" onclick="pressBtn('6')">6</button>
    <button class="btn" onclick="pressBtn('7')">7</button>
    <button class="btn" onclick="pressBtn('8')">8</button>
    <button class="btn" onclick="pressBtn('9')">9</button>
    <div></div>
    <button class="btn" onclick="pressBtn('0')">0</button>
  </div>

  <div id="log">Listo para conectar.</div>

<script>
'use strict';

/* Configuración de tu televisor */
const TV_IP = '192.168.1.35';
const TV_WS = `wss://${TV_IP}:3001`;
const KEY_STORE = 'lgtvClientKey_' + TV_IP;

/* Permisos solicitados a webOS */
const MANIFEST = {
  manifestVersion: 1,
  appVersion: '1.0.0',
  appId: 'com.lge.lgremote',
  appName: 'LG Remote',
  localizedAppNames: { '': 'LG Remote' },
  permissions: [
    'CONTROL_AUDIO',
    'CONTROL_POWER',
    'CONTROL_INPUT_JOYSTICK',
    'CONTROL_INPUT_MEDIA_PLAYBACK',
    'CONTROL_INPUT_TV',
    'CONTROL_MOUSE_AND_KEYBOARD',
    'READ_CURRENT_CHANNEL',
    'READ_NETWORK_STATE'
  ]
};

let ws = null;
let pointerWs = null;
let clientKey = localStorage.getItem(KEY_STORE);
let cmdId = 1;
const pending = {};

function setStatus(text, cls = '') {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = cls;
}

function log(text) {
  const el = document.getElementById('log');
  el.textContent = new Date().toLocaleTimeString() + ' — ' + text +
    '\n' + el.textContent;
}

function toggleConnect() {
  if (ws && (ws.readyState === WebSocket.OPEN ||
             ws.readyState === WebSocket.CONNECTING)) {
    disconnect();
  } else {
    connect();
  }
}

function connect() {
  if (location.protocol !== 'https:' && location.protocol !== 'http:') {
    setStatus('Abre la página web publicada', 'error');
    return;
  }

  setStatus('Conectando por WSS…');
  log('Conectando a ' + TV_WS);

  try {
    ws = new WebSocket(TV_WS);
  } catch (e) {
    setStatus('No se pudo iniciar', 'error');
    log(String(e));
    return;
  }

  ws.onopen = () => {
    log('Conexión abierta. Solicitando registro LG…');
    const payload = {
      forcePairing: false,
      pairingType: 'PROMPT',
      manifest: MANIFEST
    };
    if (clientKey) payload['client-key'] = clientKey;
    ws.send(JSON.stringify({
      type: 'register',
      id: 'register_0',
      payload
    }));
  };

  ws.onmessage = event => {
    let msg;
    try {
      msg = JSON.parse(event.data);
    } catch {
      log('Respuesta no reconocida del televisor');
      return;
    }

    log('Respuesta: ' + msg.type + ' ' + (msg.id || ''));

    if (msg.type === 'registered') {
      const key = msg.payload && msg.payload['client-key'];
      if (key) {
        clientKey = key;
        localStorage.setItem(KEY_STORE, key);
      }
      setStatus('Emparejado; preparando mando…', 'paired');
      document.getElementById('connect').textContent = 'Desconectar';
      getPointerSocket();
      return;
    }

    if (msg.type === 'pairing' ||
        (msg.type === 'response' && msg.id === 'register_0' &&
         msg.payload && msg.payload.pairingType === 'PROMPT')) {
      setStatus('Acepta la conexión en la tele', '');
      log('Mira la pantalla del televisor para aceptar.');
      return;
    }

    if (msg.id && pending[msg.id]) {
      const cb = pending[msg.id];
      delete pending[msg.id];
      cb(msg);
    }

    if (msg.type === 'error') {
      log('La tele ha rechazado la solicitud: ' +
          JSON.stringify(msg.payload || {}));
    }
  };

  ws.onerror = () => {
    setStatus('Error de conexión', 'error');
    log('WebSocket falló. Puede ser el puerto, el certificado o el navegador.');
  };

  ws.onclose = event => {
    setStatus('Desconectado', 'error');
    document.getElementById('connect').textContent = 'Conectar';
    pointerWs = null;
    log('Socket cerrado; código ' + event.code);
  };
}

function disconnect() {
  if (pointerWs) {
    try { pointerWs.close(); } catch (_) {}
    pointerWs = null;
  }
  if (ws) {
    try { ws.close(); } catch (_) {}
    ws = null;
  }
  setStatus('Desconectado');
  document.getElementById('connect').textContent = 'Conectar';
}

function forgetKey() {
  localStorage.removeItem(KEY_STORE);
  clientKey = null;
  disconnect();
  log('Clave guardada eliminada. Se solicitará emparejar de nuevo.');
}

function ssapSend(uri, payload, callback) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    log('No conectado al televisor');
    return false;
  }
  const id = 'cmd_' + cmdId++;
  const frame = { type: 'request', id, uri };
  if (payload) frame.payload = payload;
  if (callback) pending[id] = callback;
  ws.send(JSON.stringify(frame));
  log('Enviado: ' + uri);
  return true;
}

function getPointerSocket() {
  ssapSend(
    'ssap://com.webos.service.networkinput/getPointerInputSocket',
    null,
    msg => {
      const path = msg.payload && msg.payload.socketPath;
      if (msg.type === 'response' && path) {
        openPointerSocket(path);
      } else {
        setStatus('Conectado, controles limitados', 'paired');
        log('No se pudo obtener el socket de botones.');
      }
    }
  );
}

function openPointerSocket(path) {
  let url;
  try {
    const parsed = new URL(path, TV_WS);
    url = parsed.href;
  } catch (e) {
    log('Dirección del socket no válida: ' + path);
    return;
  }

  log('Abriendo canal de botones…');
  try {
    pointerWs = new WebSocket(url);
  } catch (e) {
    log('No se pudo abrir el canal de botones: ' + e);
    return;
  }

  pointerWs.onopen = () => {
    setStatus('Mando conectado ✓', 'ready');
    log('Canal de botones conectado.');
  };
  pointerWs.onerror = () => {
    log('Error en el canal de botones; comprueba el certificado y el protocolo.');
  };
  pointerWs.onclose = () => {
    log('Canal de botones cerrado.');
    pointerWs = null;
  };
}

function pressBtn(name) {
  if (!pointerWs || pointerWs.readyState !== WebSocket.OPEN) {
    log('Los botones no están disponibles: falta conectar el canal de control.');
    return;
  }
  pointerWs.send('type:button\nname:' + name + '\n\n');
  log('Botón: ' + name);
}

function ssapOrBtn(uri, buttonName) {
  if (pointerWs && pointerWs.readyState === WebSocket.OPEN) {
    pressBtn(buttonName);
  } else {
    ssapSend(uri);
  }
}

function powerOff() {
  ssapSend('ssap://system/turnOff');
}
</script>
</body>
                                                                            </html>
